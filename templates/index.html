<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი საიტი</title>
    
    <style>
        /* ზოგადი სტილი (კომპიუტერისთვის) */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            background-color: #f4f4f4;
            margin: 0; /* ზედმეტი დაშორებების მოსაცილებლად */
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        /* მობილური "მოდი" (როდესაც ეკრანი 600px-ზე პატარაა) */
        @media (max-width: 600px) {
            body {
                padding: 20px;
                background-color: #e9ecef; /* ფერს ვცვლით, რომ მივხვდეთ მუშაობს თუ არა */
            }
            form {
                width: 90%; 
            }
            h1 {
                font-size: 24px; /* ტექსტი მცირდება ტელეფონისთვის */
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <h1>მოგესალმებით ჩემს საიტზე</h1>
    <a href="/register">დარეგისტრირდი აქ</a>
</body>
</html>
